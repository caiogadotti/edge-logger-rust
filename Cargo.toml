[package]
name = "edgelog"
version = "0.1.0"
edition = "2021"
description = "Logger de telemetria de borda: alta vazão, WAL tolerante a queda de energia, blocos comprimidos"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
crossbeam-channel = "0.5"
rand = "0.8"
rand_distr = "0.4"
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
